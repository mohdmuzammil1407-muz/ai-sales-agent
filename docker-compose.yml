services:

  db:
    image: postgres:16-alpine
    container_name: vidio-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1
      POSTGRES_DB: vidio_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./video_agent
    container_name: vidio-backend
    ports:
      - "8000:8000"
    env_file:
      - ./video_agent/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres1@vidio-postgres:5432/vidio_agent
    volumes:
      - ./video_agent:/app
      - ./video_agent/credentials:/app/credentials:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./vide-frontend
    container_name: vidio-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://vidio-backend:8000

    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
